<style>
/* Layout: cuaderno de una página con pestañas de colores arriba, pegatinas arrastrables encima de la hoja y bandeja inferior para elegirlas. */
:root{
  --red:#E5392F; --yellow:#FFD23F; --blue:#2E7FD9; --green:#3DAA5C;
  --ink:#2B2118; --paper:#FFFFFF; --grid:#D3E6F7; --ground:#FFF1C9; --soft:#FFF8E1;
  --display:'Gochi Hand','Comic Sans MS',cursive; --hand:'Schoolbell','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--hand);font-size:18px;
  padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.book{max-width:980px;margin:0 auto;position:relative}

/* tabs */
.tabs{display:flex;gap:6px;padding-left:10px}
.tab{border:3px solid var(--ink);border-bottom:none;border-radius:14px 14px 0 0;padding:6px 12px 4px;font-family:var(--display);font-size:21px;background:var(--c);opacity:.78;transform:translateY(3px)}
.tab[aria-selected="true"]{opacity:1;transform:none;padding-top:9px}
.t-day{--c:var(--yellow)} .t-month{--c:#8DBBE8} .t-notes{--c:#9ADBA9} .t-subj{--c:#FFB3C0}

.page{position:relative;min-height:940px;background:var(--paper);border:3px solid var(--ink);border-radius:6px 22px 22px 22px;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--grid) 27px 28px),repeating-linear-gradient(90deg,transparent 0 27px,var(--grid) 27px 28px);
  box-shadow:6px 6px 0 var(--ink)}
.page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;background:radial-gradient(circle at 15px 24px,var(--ground) 0 7px,var(--ink) 7px 9px,transparent 9px) 0 0/30px 56px repeat-y;z-index:2}
.inner{position:relative;padding:18px 18px 24px 46px;display:flex;flex-direction:column;gap:14px}
.layer{position:absolute;inset:0;z-index:5;pointer-events:none}

.head{display:flex;align-items:center;gap:10px}
.nav{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);display:grid;place-items:center;flex:none;padding:0}
.nav svg{width:24px;height:24px}
.dayname{font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.bigdate{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0;justify-content:center;flex-wrap:wrap}
.bigdate b{font-family:var(--display);font-weight:400;font-size:64px;line-height:1;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;filter:url(#crayon)}
.bigdate span{font-family:var(--display);font-size:26px}
.today-btn{border:3px solid var(--ink);border-radius:999px;background:var(--green);color:#fff;padding:2px 14px;font-family:var(--display);font-size:18px;align-self:center}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:0 12px;transform:rotate(-1.5deg);align-self:flex-start;filter:url(#crayon)}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;height:56px;border-bottom:2px dashed color-mix(in srgb,var(--ink) 35%,transparent)}
.chk{width:30px;height:30px;border:3px solid var(--ink);border-radius:9px;background:var(--paper);flex:none;padding:0;display:grid;place-items:center}
.chk svg{width:20px;height:20px;display:none}
.chk[aria-checked="true"]{background:var(--green)}
.chk[aria-checked="true"] svg{display:block}
.task input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:20px;color:var(--ink);outline:none;padding:6px 2px}
.task input.done{text-decoration:line-through;text-decoration-thickness:3px;opacity:.55}
.task input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
textarea{width:100%;border:3px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.7);font:inherit;font-size:20px;line-height:28px;padding:8px 12px;resize:none;color:var(--ink)}
.notes-area{height:252px}
.notes-big{height:760px}
::placeholder{color:#8a7f73}

/* month */
.mhead{display:flex;align-items:center;gap:10px}
.mhead .title{flex:1;text-align:center;font-family:var(--display);font-size:34px;color:var(--blue);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-transform:capitalize}
.dow,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow div{text-align:center;font-family:var(--display);font-size:18px}
.cell{aspect-ratio:1/1.25;border:2.5px solid var(--ink);border-radius:10px;background:rgba(255,255,255,.85);padding:2px 3px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;overflow:hidden;text-align:left}
.cell.out{opacity:.35}
.cell.today{background:var(--yellow)}
.cell .n{font-family:var(--display);font-size:18px;line-height:1}
.cell .mini{display:flex;flex-wrap:wrap;gap:0;width:100%}
.cell .mini svg,.cell .mini span{width:17px;height:17px;font-size:13px;line-height:17px}
.cell .dots{margin-top:auto;display:flex;gap:2px}
.cell .dots i{width:7px;height:7px;border-radius:50%;background:var(--green);border:1.5px solid var(--ink)}

/* stickers */
.stk{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
.stk svg{width:100%;height:100%;display:block;filter:drop-shadow(2px 3px 0 rgba(43,33,24,.25))}
.stk .em{line-height:1;filter:drop-shadow(2px 3px 0 rgba(43,33,24,.25))}
.stk.sel{outline:3px dashed var(--blue);outline-offset:4px;border-radius:12px}
.stk:active{cursor:grabbing}

.stk .ph{width:100%;height:100%;object-fit:cover;border:4px solid #fff;border-radius:14px;box-shadow:2px 3px 0 rgba(43,33,24,.35),0 0 0 2px var(--ink);display:block;pointer-events:none}
.pick .ph{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.cell .mini .ph{width:17px;height:17px;object-fit:cover;border-radius:3px}
.pw{position:relative}
.pw .pick{width:100%}
.pw .x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--red);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center;padding:0}
.upl{display:flex;gap:8px;flex-wrap:wrap;order:-1}
.upl label,.upl button{position:relative;border:3px solid var(--ink);border-radius:12px;background:var(--green);color:#fff;padding:2px 14px;font-family:var(--display);font-size:20px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.upl button{background:var(--paper);color:var(--ink)}
.upl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.cover-photo{width:min(70vw,300px);aspect-ratio:1;object-fit:cover;border:6px solid #fff;border-radius:18px;box-shadow:6px 6px 0 var(--ink);transform:rotate(2deg);display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}

      const wl = (x1, y1, x2, y2, w, col, amp) => { // línea temblorosa como de cera
        doc.setLineCap('round'); doc.setLineWidth(w); doc.setDrawColor(...col);
        doc.line(x1 + J(amp), y1 + J(amp), x2 + J(amp), y2 + J(amp));
      };
      const wbox = (x, y, w, h, lw, col, amp) => { wl(x, y, x + w, y, lw, col, amp); wl(x + w, y, x + w, y + h, lw, col, amp); wl(x + w, y + h, x, y + h, lw, col, amp); wl(x, y + h, x, y, lw, col, amp); };
      const scribble = (x, y, w, h, c) => {
        doc.setFillColor(...mix(c, .45)); doc.rect(x, y, w, h, 'F');
        doc.setLineCap('round'); doc.setLineWidth(.55); doc.setDrawColor(...c);
        for (let yy = y + .5; yy < y + h; yy += .75) doc.line(x + .3 + J(.4), yy + J(.3), x + w - .3 + J(.4), yy + J(.5));
      };
      // hoja cuadriculada
      doc.setFillColor(255, 250, 236); doc.rect(0, 0, W, H, 'F');
      doc.setLineWidth(.1); doc.setDrawColor(200, 224, 245);
      for (let x = 0; x <= W; x += 5) doc.line(x, 0, x, H);
      for (let y = 0; y <= H; y += 5) doc.line(0, y, W, y);
      // título con subrayado de rotulador
      doc.setFont('Gochi'); doc.setFontSize(34); doc.setTextColor(...ink);
      const tt = 'Turnos ' + yY, tw = doc.getTextWidth(tt);
      doc.setFillColor(255, 224, 80); doc.roundedRect(mx - 1, 12.5, tw + 4, 4, 1.5, 1.5, 'F');
      doc.text(tt, mx + 1, 17);
      const todayK = keyOf(new Date());
      const NM = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const TAB = [[255, 143, 163], [130, 180, 240], [255, 210, 63], [150, 215, 160], [255, 175, 110], [195, 165, 240]];
      const cnt = {}; data.shifts.forEach(x => cnt[x.id] = 0);
      for (let m = 0; m < 12; m++) {
        const gx = mx + (m % 4) * gw, gy = top + Math.floor(m / 4) * (gh + 3), cw = (gw - 4) / 7, ch = (gh - 13) / 6;
        const tc = TAB[m % 6];
        doc.setFont('Gochi'); doc.setFontSize(14);
        const nw = doc.getTextWidth(NM[m]) + 5;
        doc.setFillColor(...tc); doc.setDrawColor(...ink); doc.setLineWidth(.5);
        doc.roundedRect(gx, gy - .5, nw, 6.6, 2, 2, 'FD');
        doc.setTextColor(...ink); doc.text(NM[m], gx + 2.5, gy + 4.4);
        doc.setFont('School'); doc.setFontSize(7); doc.setTextColor(...ink);
        ['L', 'M', 'X', 'J', 'V', 'S', 'D'].forEach((d, i) => doc.text(d, gx + i * cw + cw / 2, gy + 10.5, { align: 'center' }));
        const lead = (new Date(yY, m, 1, 12).getDay() + 6) % 7, total = new Date(yY, m + 1, 0).getDate();
        for (let d = 1; d <= total; d++) {
          const idx = lead + d - 1, x = gx + (idx % 7) * cw, y = gy + 12 + Math.floor(idx / 7) * ch;
          const k = keyOf(new Date(yY, m, d, 12)), iso = k.slice(2), shs = shList(iso);
          shs.forEach(q => cnt[q.id]++);
          const px = x + .3, py = y + .3, pw = cw - .6, ph = ch - .6;
          doc.setFillColor(255, 255, 255); doc.rect(px, py, pw, ph, 'F');
          if (shs.length) {
            const c0 = hex2(shs[0].c);
            if (shs[1]) { scribble(px, py, pw, ph / 2, c0); scribble(px, py + ph / 2, pw, ph / 2, hex2(shs[1].c)); }
            else scribble(px, py, pw, ph, c0);
          }
          const oc = shs.length ? dark(hex2(shs[0].c)) : ink;
          wbox(px, py, pw, ph, .45, oc, .25);
          doc.setFont('Gochi'); doc.setFontSize(8.5); doc.setTextColor(...ink);
          doc.text(String(d), px + 1, py + 3.4);
          if (shs.length) {
            doc.setFont('School'); doc.setFontSize(shs.length > 1 ? 5 : 6);
            if (shs.length > 1) shs.forEach((q, j) => doc.text(abbr(q), px + pw - .8, py + 3.2 + j * ph / 2, { align: 'right' }));
            else doc.text(abbr(shs[0]), px + pw / 2, py + ph - 1.1, { align: 'center' });
          }
          if (k === todayK) wbox(px - .2, py - .2, pw + .4, ph + .4, .9, [225, 45, 45], .3);
        }
      }
      let lx = mx; const ly = H - 8;
      doc.setFont('Gochi'); doc.setFontSize(12);
      data.shifts.forEach(x => {
        const c = hex2(x.c), t = `${x.n}: ${cnt[x.id]}`, tw2 = doc.getTextWidth(t) + 8;
        doc.setFillColor(...c); doc.setDrawColor(...ink); doc.setLineWidth(.5);
        doc.roundedRect(lx, ly - 4.5, tw2, 6.4, 3, 3, 'FD');
        doc.setTextColor(...ink); doc.text(t, lx + 4, ly); lx += tw2 + 5;
      });
      await dl.save({ filename: `turnos-${yY}.pdf`, data: doc.output('arraybuffer') });
    } catch (e) {
      if (msg && !(e && e.code === 'declined')) { msg.hidden = false; msg.textContent = 'No se pudo crear el PDF'; }
    }
  };
}

/* ---------- pegatinas en la hoja ---------- */
const BASE = 76;
function styleStk(el, s) {
  const sz = BASE * s.s;
  el.style.cssText = `left:${s.x * 100}%;top:${s.y * 100}%;width:${sz}px;height:${sz}px;transform:translate(-50%,-50%) rotate(${s.r}deg)`;
  el.style.setProperty('--f', s.f);
  const em = el.querySelector('.em'); if (em) em.style.fontSize = sz * .78 + 'px';
}
function drawLayer() {
  const layer = $('layer'); if (!layer) return;
  const p = pageData(curKey());
  layer.innerHTML = '';
  p.stk.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'stk' + (i === selected ? ' sel' : '') + (s.b === 0 ? ' nob' : '');
    el.dataset.i = i;
    el.innerHTML = stkHTML(s) + '<i class="hnd" aria-label="Cambiar tamaño"></i>';
    if (!s.em && !s.im) el.setAttribute('role', 'img'), el.setAttribute('aria-label', BY[s.id][1]);
    styleStk(el, s);
    el.addEventListener('pointerdown', e => startDrag(e, el, i, s));
    el.querySelector('.hnd').addEventListener('pointerdown', e => startResize(e, el, s));
    layer.appendChild(el);
  });
}
function startDrag(e, el, i, s) {
  e.preventDefault();
  if (selected !== i) { selected = i; layerSel(); }
  el.setPointerCapture(e.pointerId);
  const r = $('layer').getBoundingClientRect();
  const dx = e.clientX - (r.left + s.x * r.width), dy = e.clientY - (r.top + s.y * r.height);
  const mv = ev => {
    s.x = Math.min(1.02, Math.max(-.02, (ev.clientX - dx - r.left) / r.width));
    s.y = Math.min(1.02, Math.max(-.02, (ev.clientY - dy - r.top) / r.height));
    styleStk(el, s);
  };
  const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); save(); };
  el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function startResize(e, el, s) {
  e.preventDefault(); e.stopPropagation();
  const h = e.currentTarget; h.setPointerCapture(e.pointerId);
  const r = $('layer').getBoundingClientRect(), cx = r.left + s.x * r.width, cy = r.top + s.y * r.height;
  const d0 = Math.hypot(e.clientX - cx, e.clientY - cy) || 1, s0 = s.s;
  const mv = ev => { s.s = Math.min(12, Math.max(.3, s0 * Math.hypot(ev.clientX - cx, ev.clientY - cy) / d0)); styleStk(el, s); };
  const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); save(); };
  h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
}
function layerSel() {
  document.querySelectorAll('.stk').forEach(el => el.classList.toggle('sel', +el.dataset.i === selected));
  $('bar').hidden = selected < 0;
  const cs = cur_s(); $('bBorde').hidden = !(cs && cs.im);
  if (selected >= 0) { $('tray').hidden = true; $('fab').hidden = true; } else if ($('tray').hidden) $('fab').hidden = false;
}
function deselect() { selected = -1; layerSel(); }
function cur_s() { return selected >= 0 ? pageData(curKey()).stk[selected] : null; }
function mod(fn) { const s = cur_s(); if (!s) return; fn(s); save(); drawLayer(); layerSel(); }
$('bMenos').onclick = () => mod(s => s.s = Math.max(.3, +(s.s / 1.25).toFixed(2)));
$('bMas').onclick = () => mod(s => s.s = Math.min(12, +(s.s * 1.25).toFixed(2)));
$('bIzq').onclick = () => mod(s => s.r -= 15);
$('bDer').onclick = () => mod(s => s.r += 15);
$('bFlip').onclick = () => mod(s => s.f = -s.f);
$('bBorde').onclick = () => mod(s => s.b = s.b === 0 ? 1 : 0);
$('bDel').onclick = () => { const p = pageData(curKey()); p.stk.splice(selected, 1); save(); deselect(); drawLayer(); };
$('bOk').onclick = () => { deselect(); };
document.addEventListener('pointerdown', e => {
  if (selected >= 0 && !e.target.closest('.stk') && !e.target.closest('#bar')) deselect();
});

function addSticker(id, em, im) {
  if (view === 'month') { view = 'day'; render(); }
  const p = pageData(curKey()), r = $('layer').getBoundingClientRect();
  const y = Math.min(.95, Math.max(.05, (innerHeight * .38 - r.top) / r.height));
  p.stk.push({ id, em: em || '', im: im || '', x: .3 + Math.random() * .4, y, s: 1, r: Math.round((Math.random() - .5) * 20), f: 1 });
  save(); drawLayer();
  closeTray();
}

/* ---------- bandeja ---------- */
function openTray() { deselect(); $('tray').hidden = false; $('fab').hidden = true; drawTray(); }
function closeTray() { $('tray').hidden = true; if (selected < 0) $('fab').hidden = false; }
function drawTray() {
  $('cats').innerHTML = CATS.map(([k, n]) => `<button class="cat" role="tab" data-c="${k}" aria-selected="${k === cat}">${n}</button>`).join('') + '<button class="cat close" id="trayClose">Cerrar</button>';
  $('cats').querySelectorAll('.cat[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; drawTray(); });
  $('trayClose').onclick = closeTray;
  $('emoRow').hidden = cat !== 'em';
  $('upl').hidden = cat !== 'mi';
  const g = $('grid');
  if (cat === 'mi') {
    g.innerHTML = data.imgs.length ? data.imgs.map(i => `<div class="pw"><button class="pick" data-im="${i.id}" aria-label="Foto"><img class="ph" src="${i.url}" alt=""></button><button class="x" data-x="${i.id}" aria-label="Borrar foto">×</button></div>`).join('') : '<p class="hint">Aún no hay fotos. Toca “+ Foto”.</p>';
    g.querySelectorAll('.pick').forEach(b => b.onclick = () => addSticker('', '', b.dataset.im));
    g.querySelectorAll('.x').forEach(b => b.onclick = () => delImg(b.dataset.x));
  } else if (cat === 'em') {
    g.innerHTML = EMOJIS.map(e => `<button class="pick" data-e="${e}" aria-label="Emoji ${e}"><span class="em">${e}</span></button>`).join('');
    g.querySelectorAll('.pick').forEach(b => b.onclick = () => addSticker('', b.dataset.e));
  } else {
    g.innerHTML = STICKERS.filter(s => s[2] === cat).map(s => `<button class="pick" data-id="${s[0]}" aria-label="${s[1]}">${svgOf(s[0])}</button>`).join('');
    g.querySelectorAll('.pick').forEach(b => b.onclick = () => addSticker(b.dataset.id));
  }
}
$('fab').onclick = openTray;
$('emoAdd').onclick = () => { const v = $('emoIn').value.trim(); if (v) { addSticker('', v.slice(0, 8)); $('emoIn').value = ''; } };

/* ---------- pestañas y portada ---------- */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { view = t.dataset.view; if (view === 'year') yY = mCur.getFullYear(); render(); });
function drawCover() {
  const c = $('cover');
  if (data.cover) {
    c.style.backgroundImage = `linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.4)),url("${data.cover}")`;
    c.style.backgroundSize = 'cover'; c.style.backgroundPosition = 'center';
    $('coverRow').innerHTML = ''; c.classList.add('photo');
  } else {
    c.style.backgroundImage = ''; c.style.backgroundSize = ''; c.style.backgroundPosition = '';
    $('coverRow').innerHTML = ['peque', 'perro', 'lila', 'pollito'].map(svgOf).join(''); c.classList.remove('photo');
  }
}
function shrink(file, max, q, png) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const x = c.getContext('2d'); if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); } x.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q)); };
    im.onerror = rej; im.src = u;
  });
}
function delImg(id) {
  data.imgs = data.imgs.filter(i => i.id !== id);
  if (cloud) cloud.doc(base + 'img-' + id).delete().catch(() => {});
  Object.values(data.pages).forEach(p => p.stk = p.stk.filter(s => s.im !== id));
  save(); drawTray(); drawLayer();
}
$('fSt').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const pg = /png|webp|gif/.test(f.type); let u = await shrink(f, 360, .85, pg); for (let m = 300; u.length > 190000 && m >= 120; m -= 60) u = await shrink(f, m, .7, pg); data.imgs.push({ id: 'i' + Date.now(), url: u }); save(); drawTray(); } catch (x) {} };
$('fCv').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { let u = '', m = 1100, q = .8; for (;;) { u = await shrink(f, m, q); if (u.length <= 230000 || m < 500) break; if (q > .5) q -= .1; else m -= 150; } data.cover = u; data.coverV = (data.coverV || 0) + 1; data.coverDirty = 1; save(); drawCover(); showCover(); } catch (x) {} };
$('cvDel').onclick = () => { data.cover = ''; data.coverV = (data.coverV || 0) + 1; data.coverDirty = 1; save(); drawCover(); };
$('cvSee').onclick = showCover;
$('home').onclick = () => showCover();
function showCover() { closeTray(); $('cover').hidden = false; requestAnimationFrame(() => $('cover').classList.remove('open')); }
drawCover();
$('bkHere').onclick = () => { $('cover').classList.add('open'); setTimeout(() => { $('cover').hidden = true; }, 600); };
render();
cloudState = 'none'; showSync();
</script>
</body></html>
